name: Tests and apk comparison

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML reader
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compare order with real apk in Alpine
        run: python -m tools.compare_apk
      - name: Create three real Mermaid diagrams and test cases
        run: python -m tools.create_demos
      - name: Prepare diagram verification
        run: |
          if ! command -v dot >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y graphviz
          fi
          npm install --prefix "$RUNNER_TEMP/visual-check" playwright@1.56.1
      - name: Compare diagrams with real apk dot
        run: python -m tools.compare_visualization
      - name: Render Mermaid, verify topology and SVG export
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/visual-check/node_modules/playwright"
          node tools/render_graphs.cjs
      - name: Save diagrams and reference images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-diagrams
          path: generated/demos/
